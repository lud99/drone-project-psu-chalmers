<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ATOS Drone Platform</title>
    <!-- <link rel="stylesheet" href="/misc/bootstrap.min.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="/misc/leaflet.css" /> -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 480px;
            border-radius: 10px;
        }

        .video-container {
            display: grid;
            gap: 5px;
            height: 480px;
            background: #2c3e50;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-3">
        <h1 class="text-center mb-4">ATOS Drone Platform</h1>

        <div class="row">
            <!-- Left Side -->
            <div class="col-md-8">
                <!-- Video Section -->
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        Live Feed
                    </div>
                    <div class="card-body p-0">
                        <div id="videoContainer" class="video-container">
                            <img id="video1" class="video-stream" src="/api/v1/video_feed/drone2763KAH0H1X35H">
                            <img id="merged" class="video-stream" src="/api/v1/video_feed/merged"
                                style="display: none;">
                            <img id="video2" class="video-stream" src="/api/v1/video_feed/drone2763KAH0H1X35H_annotated"
                                style="display: none;">
                        </div>
                    </div>
                </div>
                <!-- Control Panel -->
                <div class="row">
                    <div class="col-lg-6">
                        <div class="card mb-3">
                            <div class="card-header bg-primary text-white">
                                Controls
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <h5>Shown Video Stream</h5>
                                    <select id="layoutSelect" class="form-select">
                                        <option value="sidebyside">Side by Side (First 2 Drones)</option>
                                        <hr>
                                    </select>
                                </div>
                                <div id="drone-status-container">
                                </div>

                                <div class="d-grid gap-2">
                                    <button id="rtnAllBtn" class="btn btn-info btn-lg">Return Home All</button>
                                </div>

                                <div class="mt-3 all-drone-controls text-center">
                                    <hr>
                                    <h5>Detection simulation</h5>
                                    <button id="sendDetection">Send test detection</button>
                                    <button id="clearDetection">Reset detections</button>
                                    <div>
                                        <input type="text" id="detection_id" />Tracker id
                                        <!-- <input type="number" id="detection_lat" />lat -->
                                        <!-- <input type="number" id="detection_lon" />lon -->
                                        <input type="text" id="detection_drone_id" />Drone id
                                        <select id="detection_class">
                                            <option value="person">Person</option>
                                            <option value="vehicle">Vehicle</option>
                                            <option value="car">Car</option>
                                            <option value="truck">Truck</option>
                                            <option value="bus">Bus</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card mb-3 h-100">
                            <div class="card-header bg-primary text-white">
                                Active missions
                            </div>
                            <div class="card-body">
                                <div id="active-missions-list">
                                    <p class="text-muted">No active missions...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Side -->
            <div class="col-md-4">
                <!-- Map Section -->
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        Create Surveillance Area
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
                <!-- Mission planning section -->
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Mission Planning
                    </div>
                    <div class="card-body">
                        <div id="mission-list-container" class="row">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mission modal -->
    <div class="modal fade" id="missionModal" tabindex="-1" aria-labelledby="missionModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="missionModalLabel">Mission details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-content-area">
                    Info regarding the mission...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Choose Mission</button>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="/misc/bootstrap.bundle.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script src="/misc/leaflet.js"></script> -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        const BACKEND_URL_WS = "ws://localhost:8000";
        const BACKEND_URL_HTTP = "http://localhost:8000";
        // Initialize Map
        let activePolygon = null;  // Surveillance area polygon
        let coveragePolygon = null;  // Drone coverage area polygon
        let userMarker = null;
        let watchAreaMarker = null;
        let markers = {}

        let proposedMissions = new Map()

        async function dispatchMission(missionId) {
            try {
                const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/missions/dispatch/${missionId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/text"
                    },
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                console.log(result)

                if (!result.error) {
                    alert("Mission dispatched ok");
                }
                else {
                    alert("Error: " + result.error);
                }

            } catch (error) {
                console.error("Error to dispatch", error);
            }
        }



        // Mission display
        const missionModal = document.getElementById('missionModal');
        let currentTaskData = null;
        let currentMissionModalId = ""
        let modalMap = null;
        let droneId = null;

        let allWaypoints = [];
        let activeMissionMapId = "";
        let activeMaps = [];


        // Create drone cards for connected drones
        function createDroneStatusCard(droneId) {
            console.log("Trying to create card for:", droneId);
            const container = document.getElementById('drone-status-container');
            console.log("Container found:", container);

            if (document.getElementById(`alt${droneId}`)) return;

            const cardHtml = `
                <div class="status-card mb-3" id="card-${droneId}">
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Drone ${droneId} Status</h5>
                            <div>Altitude: <span id="alt${droneId}">--</span> m</div>
                            <div>Speed: <span id="speed${droneId}">--</span> m/s</div>
                            <div>Battery: <span id="battery${droneId}">--</span>%</div>
                        </div>
                        <div class="col-md-6">
                            <h5>Drone ${droneId} Specs</h5>
                            <div>Drone Type: <span id="dronetype${droneId}">--</span></div>
                            <div>Camera: <span id="camera${droneId}">--</span></div>
                            <div>Camera resolution: <span id="res${droneId}">--</span></div>
                            <div>Speaker: <span id="speaker${droneId}">--</span></div>
                            <div>Spotlight: <span id="spotlight${droneId}">--</span></div>
                        </div>
                        <div class="drone-controls mt-2">
                            <button data-drone-id="${droneId}" data-command="flight_return_to_home"
                                class="btn btn-info btn-sm drone-command-btn">Return Home</button>
                        </div>
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('afterbegin', cardHtml);

            setupNewButtons(droneId);
        }

        function setupNewButtons(droneId) {
            const card = document.getElementById(`card-${droneId}`);
            card.querySelectorAll('.drone-command-btn').forEach(button => {
                button.onclick = function () {
                    const cmd = this.getAttribute('data-command');
                    sendFlightCommand(droneId, cmd);
                };
            });
        }

        // Creates mission buttons
        const container = document.getElementById('mission-list-container');
        document.querySelector("#missionModal .btn-success").addEventListener("click", (event) => {
            dispatchMission(currentMissionModalId)
        })

        function createMissionButtons() {
            container.innerHTML = "";
            proposedMissions.values().forEach((mission, index) => {
                container.innerHTML += `
                <div class="col-12 mb-2">
                    <div class="d-flex justify-content-between align-items-center" 
                        style="height: 100px; background: #e9ecef; padding: 15px; border-radius: 5px; border: 1px solid #ccc;">
                        <div>
                            <strong>Mission ${index + 1}</strong>
                            <div>${mission.mission_type}</div>
                        </div>
                        <div class="mt-2">
                            <button class="btn btn-success btn-sm mission-action-btn" 
                                    data-mission-id="${mission.mission_id}" 
                                    data-bs-toggle="modal" 
                                    data-bs-target="#missionModal">
                                Show More Info
                            </button>
                        </div>
                    </div>
                </div>
            `;
            });
        }

        missionModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const missionId = button.getAttribute('data-mission-id');
            const selectedMission = proposedMissions.get(missionId);
            currentMissionModalId = missionId
            const modalTitle = missionModal.querySelector('.modal-title');
            const modalBody = missionModal.querySelector('#modal-content-area');
            droneId = selectedMission.tasks.length > 0 ? selectedMission.tasks[0].drone_id : "Unknown Drone";

            modalTitle.innerHTML = `
                <div class="d-flex flex-column">
                    <span class="fs-5">${selectedMission.description}</span>
                    <span class="badge bg-dark mt-1" style="width: fit-content;">Drone: ${droneId}</span>
                </div>
            `;

            let fullContent = '';
            activeMissionMapId = `map-overview-${missionId}`;
            allWaypoints = [];

            selectedMission.tasks.forEach((currentTaskData, idx) => {
                let paramsHtml = '';
                const action = currentTaskData.action;
                const p = currentTaskData.params;

                console.log(currentTaskData)

                if (action === 'go_to') {
                    const waypointNumber = allWaypoints.length + 1;
                    allWaypoints.push({
                        coords: [p.lat, p.lon],
                        label: `Waypoint ${waypointNumber}`
                    });

                    paramsHtml = `<strong>Coordinates:</strong> ${p.lat}, ${p.lon}<br><strong>Altitude:</strong> ${p.alt}m`;
                }
                else if (action === 'play_audio') {
                    paramsHtml = `<p><strong>Plays audiofile:</strong> ${p.file} (${p.duration_seconds}s)</p>`;
                }
                else if (action === 'led') {
                    paramsHtml = `<p><strong>Type:</strong> <span style="type:${p.type}"></span> ${p.type} (${p.pattern})</p>`;
                }
                else if (action === 'spotlight') {
                    paramsHtml = `<p><strong>Pattern:</strong> ${p.pattern} (${p.duration_seconds}s)</p>`;
                }
                else if (action == 'angle_camera') {
                    paramsHtml = `<p><strong>Pitch:</strong> ${p.pitch} <br> <strong>Yaw:</strong> ${p.yaw}`
                }
                else if (p != null) {
                    paramsHtml = '<ul>';
                    for (const [key, value] of Object.entries(p)) {
                        paramsHtml += `<li><strong>${key}:</strong> ${value}</li>`;
                    }
                    paramsHtml += '</ul>';
                }

                fullContent += `
                    <div class="task-card mb-4 border-bottom pb-3">
                        <div class="d-flex justify-content-between">
                            <strong class="fs-5">Task ${idx + 1}</strong>
                            <span class="badge bg-secondary">${action}</span>
                        </div>
                        <div class="mt-2">
                            ${paramsHtml}
                        </div>
                    </div>
                `;
            });

            let mapHtml = '';
            if (allWaypoints.length > 0) {
                mapHtml = `
                    <div class="mb-4">
                        <h6>Mission Route Overview</h6>
                        <div id="${activeMissionMapId}" style="height: 250px; width: 100%; border-radius: 8px; background: #eee; border: 1px solid #ccc;"></div>
                    </div>
                    <hr>
                `;
            }

            modalBody.innerHTML = mapHtml + fullContent;
        });

        const lastDronePositions = {};
        // Creates map for action = go_to
        missionModal.addEventListener('shown.bs.modal', function () {
            activeMaps.forEach(m => m.remove());
            activeMaps = [];

            const container = document.getElementById(activeMissionMapId);
            if (!container || allWaypoints.length === 0) return;

            const map = L.map(activeMissionMapId).setView(allWaypoints[0].coords, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const markerGroup = L.featureGroup();

            allWaypoints.forEach(point => {
                const marker = L.marker(point.coords).addTo(markerGroup);

                marker.bindTooltip(point.label, {
                    permanent: true,
                    direction: 'right',
                    offset: [10, 0]
                }).openTooltip();
            });

            const currentPos = lastDronePositions[droneId];

            if (currentPos) {
                const droneMarker = L.circleMarker(currentPos, {
                    radius: 8,
                    fillColor: "#ff3300",
                    color: "#fff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(markerGroup);


                droneMarker.bindTooltip("Drone position", {
                    permanent: true,
                    direction: 'top',
                    className: 'drone-pos-label'
                }).openTooltip();
            }

            if (allWaypoints.length > 1) {
                const pathCoords = allWaypoints.map(p => p.coords);
                L.polyline(pathCoords, { color: 'blue', weight: 3, opacity: 0.6, dashArray: '5, 10' }).addTo(map);
            }

            markerGroup.addTo(map);
            map.fitBounds(markerGroup.getBounds(), { padding: [30, 30] });

            setTimeout(() => { map.invalidateSize(); }, 200);
            activeMaps.push(map);
        });

        // Initialize Surviellance area map
        const map = L.map('map').setView([57.705841, 11.938096], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        /**
          * Function to fetch and display user location
          * @param {boolean} centerMap - Whether to pan the map to the user
          */
        function locateUser(centerMap = false) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        if (centerMap) map.setView([lat, lng], 15);

                        // Use a CircleMarker instead of a standard Marker
                        if (!userMarker) {
                            userMarker = L.circleMarker([lat, lng], {
                                radius: 10,
                                fillColor: "#007bff",
                                color: "#fff",
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.8
                            }).addTo(map).bindPopup("You are here");
                        } else {
                            userMarker.setLatLng([lat, lng]);
                        }
                    },
                    (error) => {
                        console.log("Could not fetch position:", error);
                        if (centerMap) map.setView([57.705841, 11.938096], 15);
                    }
                );
            }
        }

        // Initial location fetch (without centering unless required)
        locateUser(true);

        //  Map changes
        // Load surveillance area and coverage overlays
        async function loadWatchArea() {

            try {

                const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/get_watch_area`);
                const data = await response.json();

                if (data.points && data.points.length > 0) {

                    const latlngs = data.points.map(p => [p.lat, p.lon]);

                    activePolygon = L.polygon(latlngs, {
                        color: "green",
                        fillOpacity: 0.3
                    }).addTo(map);

                    map.fitBounds(activePolygon.getBounds());
                }

                // Display coverage rectangle
                if (data.coverage && data.coverage.length > 0) {
                    if (coveragePolygon) {
                        map.removeLayer(coveragePolygon);
                    }
                    const droneCorners = data.coverage[0];
                    const coverageLatlngs = droneCorners.map(p => [p[0], p[1]]);
                    coveragePolygon = L.polygon(coverageLatlngs, {
                        color: "#0000AA",
                        weight: 2,
                        dashArray: "5, 5",
                        fillColor: "#0000AA",
                        fillOpacity: 0.1
                    }).addTo(map);
                }

            } catch (error) {
                console.error("Failed to load watch area:", error);
            }
        }
        loadWatchArea();
        // Create a custom control
        // -------- POLYGON MODE --------

        let polygonMode = false;
        let polygonPoints = [];
        //let activePolygon = null;
        let previewLine = null;


        // -------- CUSTOM CONTROL --------

        const LocateControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                container.style.backgroundColor = 'white';
                container.style.width = '34px';
                container.style.height = '34px';
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';
                container.style.cursor = 'pointer';
                container.title = "Go to my location";
                container.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 16.5017C14.4853 16.5017 16.5 14.487 16.5 12.0017C16.5 9.5164 14.4853 7.50168 12 7.50168C9.51472 7.50168 7.5 9.5164 7.5 12.0017C7.5 14.487 9.51472 16.5017 12 16.5017ZM12 14.5034C10.6184 14.5034 9.49832 13.3833 9.49832 12.0017C9.49832 10.62 10.6184 9.5 12 9.5C13.3816 9.5 14.5017 10.62 14.5017 12.0017C14.5017 13.3833 13.3816 14.5034 12 14.5034Z" fill="#0F0F0F"/><path fill-rule="evenodd" clip-rule="evenodd" d="M11 1C11 0.447715 11.4477 0 12 0C12.5523 0 13 0.447715 13 1V2.04938C17.7244 2.51844 21.4816 6.27558 21.9506 11H23C23.5523 11 24 11.4477 24 12C24 12.5523 23.5523 13 23 13H21.9506C21.4816 17.7244 17.7244 21.4816 13 21.9506V23C13 23.5523 12.5523 24 12 24C11.4477 24 11 23.5523 11 23V21.9506C6.27558 21.4816 2.51844 17.7244 2.04938 13H1C0.447715 13 0 12.5523 0 12C-1.19209e-07 11.4477 0.447715 11 1 11H2.04938C2.51844 6.27558 6.27558 2.51844 11 2.04938V1ZM12 20.0016C7.58083 20.0016 3.99839 16.4192 3.99839 12C3.99839 7.58083 7.58083 3.99839 12 3.99839C16.4192 3.99839 20.0016 7.58083 20.0016 12C20.0016 16.4192 16.4192 20.0016 12 20.0016Z" fill="#0F0F0F"/></svg>';

                L.DomEvent.disableClickPropagation(container);
                container.onclick = () => locateUser(true);
                return container;
            }
        });
        map.addControl(new LocateControl());

        const customControl = L.Control.extend({
            options: { position: 'topleft' },

            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');

                container.style.backgroundColor = 'white';
                container.style.width = '34px';
                container.style.height = '34px';
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';
                container.style.cursor = 'pointer';
                container.title = "Click to mark an area";
                container.innerHTML = '<img src="/images/penna_with_sträck.jpg" width=28>'

                L.DomEvent.disableClickPropagation(container);

                container.onclick = function () {

                    // Erase old polygon
                    if (activePolygon) {
                        map.removeLayer(activePolygon);
                        activePolygon = null;
                    }

                    if (previewLine) {
                        map.removeLayer(previewLine);
                        previewLine = null;
                    }

                    polygonMode = true;
                    polygonPoints = [];

                    console.log("Polygon drawing started");
                };

                return container;
            }
        });

        map.addControl(new customControl());


        // -------- CLICK HANDLER --------

        map.on('click', function (e) {

            if (!polygonMode) return;

            polygonPoints.push(e.latlng);

            // Create a polygon when at least 2 points are chosen
            if (!activePolygon) {
                activePolygon = L.polygon(polygonPoints, {
                    color: "#ff0000",
                    weight: 2,
                    fillColor: "#ff0000",
                    fillOpacity: 0.2
                }).addTo(map);
            } else {
                activePolygon.setLatLngs(polygonPoints);
            }
        });


        // -------- LIVE PREVIEW --------

        map.on('mousemove', function (e) {

            if (!polygonMode || polygonPoints.length === 0) return;

            const previewPoints = [...polygonPoints, e.latlng];

            if (!previewLine) {
                previewLine = L.polyline(previewPoints, {
                    color: "#ff0000",
                    dashArray: "5,5"
                }).addTo(map);
            } else {
                previewLine.setLatLngs(previewPoints);
            }
        });



        // -------- DOUBLE CLICK TO FINISH --------
        map.doubleClickZoom.disable();
        map.on('dblclick', function (e) {

            if (!polygonMode) return;

            polygonMode = false;

            if (previewLine) {
                map.removeLayer(previewLine);
                previewLine = null;
            }

            if (activePolygon) {
                activePolygon.setStyle({
                    color: "green",
                    fillColor: "green"
                });
            }

            console.log("Polygon finalized");
        });

        //-------New button for sending area coordinates to backend--------


        const sendCoordinates = L.Control.extend({
            options: { position: 'topleft' },

            onAdd: function (map) {

                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');

                container.style.backgroundColor = '#28a745';
                container.style.width = '34px';
                container.style.height = '34px';
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';
                container.style.cursor = 'pointer';
                container.style.color = 'white';
                container.title = "Send area to backend";
                container.innerHTML = "GO";

                L.DomEvent.disableClickPropagation(container);

                container.onclick = async function () {

                    if (!activePolygon) {
                        alert("No polygon created.");
                        return;
                    }

                    const latlngs = activePolygon.getLatLngs()[0];

                    const coordinates = latlngs.map(p => ({
                        lat: p.lat,
                        lon: p.lng
                    }));

                    try {
                        const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/set_watch_area`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "text/plain"
                            },
                            body: JSON.stringify({
                                msg_type: "set_watch_area",
                                area: {
                                    points: coordinates
                                }
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }

                        const result = await response.json();
                        console.log(result)

                        if (result.error) {
                            alert("Error: " + result.error);
                            return;
                        }

                        if (result.data && result.data.mission.length === 0) {
                            alert(result.data.message || "No drone available for GotoSurveil mission");
                            return
                        }

                        alert(`Dispatched ${result.data.mission.drone_id} on surveil mission`)



                        // If the backend returned valid coordinates, add a marker to the map
                        const coords = [result.data.mission.coordinates.lat, result.data.mission.coordinates.lon];
                        const altitude = result.data.mission.coordinates.alt;
                        if (coords) {
                            const watchAreaIcon = L.icon({
                                iconUrl: '/images/camera.png',
                                iconSize: [20, 15], // Maintain aspect ratio to prevent stretching
                                iconAnchor: [10, 15],
                                popupAnchor: [0, -28]
                            });

                            if (watchAreaMarker) {
                                watchAreaMarker.setLatLng(coords);
                            } else {
                                watchAreaMarker = L.marker(coords, {
                                    icon: watchAreaIcon,
                                    title: 'Watch Area Coordinates'
                                }).addTo(map)
                                    .bindPopup(`Target altitude: ${altitude}m`)
                            }
                        }

                        // Draw coverage polygon if available
                        if (result.data.coverage_corners && result.data.coverage_corners.length > 0) {
                            const corners = result.data.coverage_corners[0];
                            const latlngs = corners.map(corner => [corner[0], corner[1]]);

                            if (coveragePolygon) {
                                map.removeLayer(coveragePolygon);
                            }

                            coveragePolygon = L.polygon(latlngs, {
                                color: '#0000AA',
                                title: 'Estimated coverage area',
                                weight: 2,
                                dashArray: '5, 5',
                                fillColor: '#0000AA',
                                fillOpacity: 0.1
                            }).addTo(map);

                            coveragePolygon.bindPopup(`Drone ${result.data.mission.drone_id} estimated coverage area. Target altitude: ${altitude}m`);
                        }

                    } catch (error) {
                        console.error("Error sending watch area", error);
                        alert("Failed to send watch area to backend " + error);
                    }
                };
                return container;
            }
        });


        map.addControl(new sendCoordinates());

        //End of map changes


        // WebSocket Connections
        const atosWS = new WebSocket(`${BACKEND_URL_WS}/api/v1/ws/atos`);
        const flightmanagerWS = new WebSocket(`${BACKEND_URL_WS}/api/v1/ws/flightmanager`);

        // Handle Layout Changes
        document.getElementById('layoutSelect').addEventListener('change', function () {
            const layout = this.value;
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            const videoContainer = document.getElementById('videoContainer');

            video1.style.display = 'none';
            video2.style.display = 'none';
            videoContainer.style.gridTemplateColumns = '1fr';

            if (layout === 'sidebyside') {
                if (connectedDroneIds.length >= 2) {
                    video1.src = `/api/v1/video_feed/drone${connectedDroneIds[0]}`;
                    video2.src = `/api/v1/video_feed/drone${connectedDroneIds[1]}`;

                    video1.style.display = 'block';
                    video2.style.display = 'block';
                    videoContainer.style.gridTemplateColumns = '1fr 1fr';
                } else {
                    alert("Need at least 2 drones for Side by Side");
                    video1.style.display = 'block';
                }
            } else {

                video1.src = `/api/v1/video_feed/drone${layout}`;
                video1.style.display = 'block';
            }
        });

        // Handle Drone Data
        const specsLoaded = {};

        let connectedDroneIds = [];

        function updateVideoDropdown(droneId) {
            const select = document.getElementById('layoutSelect');

            if (select.querySelector(`option[value="${droneId}"]`)) return;

            if (!connectedDroneIds.includes(droneId)) {
                connectedDroneIds.push(droneId);
                const optionNormal = document.createElement('option');
                optionNormal.value = droneId;
                optionNormal.textContent = `Drone: ${droneId} (Normal)`;
                select.appendChild(optionNormal);

                const optionAnnotated = document.createElement('option');
                optionAnnotated.value = `${droneId}_annotated`;
                optionAnnotated.textContent = `Drone: ${droneId} (Annotated)`;
                select.appendChild(optionAnnotated);
            }
        }

        function handleDroneUpdate(data) {
            const droneId = data.drone_id;
            console.log("All data", data)
            if (!droneId) return;

            if (!document.getElementById(`card-${droneId}`)) {
                createDroneStatusCard(droneId);
                updateVideoDropdown(droneId);
            }

            const typeElem = document.getElementById(`dronetype${droneId}`);

            if (typeElem && (data.drone_type || data.model)) {
                const typeText = data.drone_type || "";
                const modelText = data.model || "";
                const combinedName = (typeText + " " + modelText).trim();

                if (combinedName) {
                    typeElem.textContent = combinedName;
                }
            }

            if (data.capabilities && !specsLoaded[droneId]) {
                const caps = data.capabilities;

                const hasCamera = caps.camera;
                document.getElementById(`camera${droneId}`).textContent = hasCamera ? "Yes" : "No";
                if (hasCamera) {
                    document.getElementById(`res${droneId}`).textContent =
                        caps.camera.resolution_width + "x" + caps.camera.resolution_height;
                } else {
                    document.getElementById(`res${droneId}`).textContent = "N/A";
                }

                const hasSpeaker = caps.speaker && caps.speaker.audio_files && caps.speaker.audio_files.length > 0;
                document.getElementById(`speaker${droneId}`).textContent = hasSpeaker ? "Yes" : "No";
                document.getElementById(`spotlight${droneId}`).textContent = caps.spotlight ? "Yes" : "No";

                specsLoaded[droneId] = true;
            }

            if (data.telemetry) {
                const t = data.telemetry;
                lastDronePositions[droneId] = [t.lat, t.lon];

                const altElem = document.getElementById(`alt${droneId}`);
                if (altElem) {
                    altElem.textContent = t.alt.toFixed(1);
                    document.getElementById(`speed${droneId}`).textContent = t.speed.toFixed(1);
                    document.getElementById(`battery${droneId}`).textContent = t.battery_percent;
                }

                if (markers[droneId]) {
                    markers[droneId].setLatLng([t.lat, t.lon]);
                } else {
                    markers[droneId] = L.marker([t.lat, t.lon]).addTo(map);
                }
            }
        }


        flightmanagerWS.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log("From server:", data);

            if (data.msg_type === "error") {
                alert(data.error);
                return;
            }

            if (data.msg_type === "connected_drones") {
                data.drones.forEach(drone => {
                    handleDroneUpdate(drone);
                });
            }

            else if (data.drone_id) {
                handleDroneUpdate(data);
            }

            if (data.msg_type == "proposed_missions") {
                data.missions.forEach(mission => {
                    proposedMissions.set(mission.mission_id, mission)
                });
                createMissionButtons();
            }
        };

        // Control Handlers
        document.getElementById('startBtn').addEventListener('click', () => {
            atosWS.send(JSON.stringify({ command: 'start' }));
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            atosWS.send(JSON.stringify({ command: 'stop' }));
        });


        function sendFlightCommand(droneId, command) {
            if (flightmanagerWS.readyState === WebSocket.OPEN) {
                const message = {
                    drone_id: parseInt(droneId, 10),
                    command: command
                };
                const jsonMessage = JSON.stringify(message);
                flightmanagerWS.send(jsonMessage);
                console.log(`Sent command to flightmanagerWS: ${jsonMessage}`);
            } else {
                console.error("FlightManager WebSocket is not open. Cannot send command:", command, "for drone", droneId);
                alert("FlightManager connection is not active. Cannot send command."); // User feedback
            }
        }

        // Update this for more drones than 1 and 2
        document.querySelectorAll('.all-drone-command-btn').forEach(button => {
            button.addEventListener('click', function () {
                const command = this.getAttribute('data-command');
                if (command) {
                    console.log(`Sending command '${command}' to all drones.`);
                    sendFlightCommand(1, command);
                    sendFlightCommand(2, command);
                    // Add more drone IDs here if needed in the future
                    // sendFlightCommand(3, command);
                } else {
                    console.error("All-drone command button is missing data-command attribute:", this);
                }
            });
        });

        document.querySelector("#sendDetection").onclick = async (event) => {
            try {
                const fyrfästet = [57.693093, 11.984072];

                const response = await fetch("/api/v1/set_detections", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/text"
                    },

                    body: JSON.stringify(
                        [
                            {
                                drone_ids: [document.getElementById("detection_drone_id").value],
                                gps_position: fyrfästet,
                                object_type: document.getElementById("detection_class").value,
                                detection_id: document.getElementById("detection_id").value,
                                timestamp: new Date().getMilliseconds()
                            }
                        ]
                    )
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                console.log(result)

                if (!result.error) {
                    console.log("detections sent ok");
                }
                else {
                    alert("Error: " + result.error);
                }

            } catch (error) {
                console.error("Error sending detections", error);
                alert("Failed to send detections to backend");
            }
        }

        document.querySelector("#clearDetection").onclick = async (event) => {
            try {
                const fyrfästet = [57.693093, 11.984072];

                const response = await fetch("/api/v1/set_detections", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/text"
                    },

                    body: JSON.stringify(
                        [

                        ]
                    )
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                console.log(result)

                if (!result.error) {
                    console.log("detections sent ok");
                }
                else {
                    alert("Error: " + result.error);
                }

            } catch (error) {
                console.error("Error sending detections", error);
                alert("Failed to send detections to backend");
            }
        }
    </script>
</body>
