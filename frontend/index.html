<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ATOS Drone Platform</title>
    <!-- <link rel="stylesheet" href="/misc/bootstrap.min.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="/misc/leaflet.css" /> -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 400px;
            border-radius: 10px;
        }

        .video-container {
            display: grid;
            gap: 5px;
            height: 480px;
            background: #2c3e50;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-3">
        <h1 class="text-center mb-4">ATOS Drone Platform</h1>

        <div class="row">
            <!-- Video Section -->
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        Live Feed
                        <span id="atosStatus" class="badge bg-warning float-end">TEST INACTIVE</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="videoContainer" class="video-container">
                            <img id="video1" class="video-stream" src="/api/v1/video_feed/drone2763KAH0H1X35H">
                            <img id="merged" class="video-stream" src="/api/v1/video_feed/merged"
                                style="display: none;">
                            <img id="video2" class="video-stream" src="/api/v1/video_feed/drone2763KAH0H1X35H_annotated"
                                style="display: none;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Control Panel -->
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        Controls
                    </div>
                    <div class="card-body">
                        <!-- Video Layout Control -->
                        <div class="mb-3">
                            <h5>Video Layout</h5>
                            <select id="layoutSelect" class="form-select">
                                <option value="single">Single View</option>
                                <option value="sidebyside">Side by Side</option>
                                <option value="drone1">Drone 1 Only</option>
                                <option value="drone2">Drone 2 Only</option>
                            </select>
                        </div>

                        <!-- Status Display -->
                        <div class="status-card mb-3">
                            <h5>Drone 1 Status</h5>
                            <div>Altitude: <span id="alt1">--</span> m</div>
                            <div>Speed: <span id="speed1">--</span> m/s</div>
                            <div>Battery: <span id="battery1">--</span>%</div>

                            <div class="drone-controls mt-2">
                                <button id="armBtn1" data-drone-id="1" data-command="flight_arm"
                                    class="btn btn-warning btn-sm">Arm</button>
                                <button id="takeoffBtn1" data-drone-id="1" data-command="flight_take_off"
                                    class="btn btn-success btn-sm">Take Off</button>
                                <button id="rthBtn1" data-drone-id="1" data-command="flight_return_to_home"
                                    class="btn btn-info btn-sm">Return Home</button>
                            </div>
                        </div>
                        <div class="status-card mb-3">
                            <h5>Drone 2 Status</h5>
                            <div>Altitude: <span id="alt2">--</span> m</div>
                            <div>Speed: <span id="speed2">--</span> m/s</div>
                            <div>Battery: <span id="battery2">--</span>%</div>
                            <div class="drone-controls mt-2">
                                <button id="armBtn2" data-drone-id="2" data-command="flight_arm"
                                    class="btn btn-warning btn-sm">Arm</button>
                                <button id="takeoffBtn2" data-drone-id="2" data-command="flight_take_off"
                                    class="btn btn-success btn-sm">Take Off</button>
                                <button id="rthBtn2" data-drone-id="2" data-command="flight_return_to_home"
                                    class="btn btn-info btn-sm">Return Home</button>
                            </div>

                        </div>

                        <!-- Control Buttons -->
                        <div class="d-grid gap-2">
                            <button id="startBtn" class="btn btn-success btn-lg">Start Test</button>
                            <button id="stopBtn" class="btn btn-danger btn-lg">Emergency Stop</button>
                        </div>
                        <div class="mt-3 all-drone-controls text-center">
                            <hr>
                            <h5>All Drone Commands</h5>
                            <button id="armAllBtn" data-command="flight_arm"
                                class="btn btn-warning all-drone-command-btn">Arm All</button>
                            <button id="takeoffAllBtn" data-command="flight_take_off"
                                class="btn btn-success all-drone-command-btn">Take Off All</button>
                            <button id="rthAllBtn" data-command="flight_return_to_home"
                                class="btn btn-info all-drone-command-btn">Return Home All</button>
                        </div>

                    </div>
                </div>

                <!-- Map Section -->
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Live Map
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="/misc/bootstrap.bundle.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script src="/misc/leaflet.js"></script> -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        const BACKEND_URL = "ws://localhost:8000";
        // Initialize Map
        let activePolygon = null;

        const map = L.map('map').setView([57.705841, 11.938096], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const markers = {
            1: L.marker([57.705841, 11.938096]).addTo(map),
            2: L.marker([57.705941, 11.939096]).addTo(map)
        };

        //  Map changes
        // Save the last polygon that was made when updating the website
        async function loadWatchArea() {

            try {

                const response = await fetch("/api/v1/get_watch_area");
                const data = await response.json();

                if (data.points && data.points.length > 0) {

                    const latlngs = data.points.map(p => [p.lat, p.lon]);

                    activePolygon = L.polygon(latlngs, {
                        color: "green",
                        fillOpacity: 0.3
                    }).addTo(map);

                    map.fitBounds(activePolygon.getBounds());
                }

            } catch (error) {
                console.error("Failed to load watch area:", error);
            }
        }
        loadWatchArea();
        // Skapa en custom control
        // -------- POLYGON MODE --------

        let polygonMode = false;
        let polygonPoints = [];
        //let activePolygon = null;
        let previewLine = null;


        // -------- CUSTOM CONTROL --------

        const customControl = L.Control.extend({
            options: { position: 'topleft' },

            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');

                container.style.backgroundColor = 'white';
                container.style.width = '34px';
                container.style.height = '34px';
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';
                container.style.cursor = 'pointer';
                container.title = "Click to mark an area";
                container.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 16.5017C14.4853 16.5017 16.5 14.487 16.5 12.0017C16.5 9.5164 14.4853 7.50168 12 7.50168C9.51472 7.50168 7.5 9.5164 7.5 12.0017C7.5 14.487 9.51472 16.5017 12 16.5017ZM12 14.5034C10.6184 14.5034 9.49832 13.3833 9.49832 12.0017C9.49832 10.62 10.6184 9.5 12 9.5C13.3816 9.5 14.5017 10.62 14.5017 12.0017C14.5017 13.3833 13.3816 14.5034 12 14.5034Z" fill="#0F0F0F"/><path fill-rule="evenodd" clip-rule="evenodd" d="M11 1C11 0.447715 11.4477 0 12 0C12.5523 0 13 0.447715 13 1V2.04938C17.7244 2.51844 21.4816 6.27558 21.9506 11H23C23.5523 11 24 11.4477 24 12C24 12.5523 23.5523 13 23 13H21.9506C21.4816 17.7244 17.7244 21.4816 13 21.9506V23C13 23.5523 12.5523 24 12 24C11.4477 24 11 23.5523 11 23V21.9506C6.27558 21.4816 2.51844 17.7244 2.04938 13H1C0.447715 13 0 12.5523 0 12C-1.19209e-07 11.4477 0.447715 11 1 11H2.04938C2.51844 6.27558 6.27558 2.51844 11 2.04938V1ZM12 20.0016C7.58083 20.0016 3.99839 16.4192 3.99839 12C3.99839 7.58083 7.58083 3.99839 12 3.99839C16.4192 3.99839 20.0016 7.58083 20.0016 12C20.0016 16.4192 16.4192 20.0016 12 20.0016Z" fill="#0F0F0F"/></svg>';

                L.DomEvent.disableClickPropagation(container);

                container.onclick = function () {

                    // Ta bort gammal polygon
                    if (activePolygon) {
                        map.removeLayer(activePolygon);
                        activePolygon = null;
                    }

                    if (previewLine) {
                        map.removeLayer(previewLine);
                        previewLine = null;
                    }

                    polygonMode = true;
                    polygonPoints = [];

                    console.log("Polygon drawing started");
                };

                return container;
            }
        });

        map.addControl(new customControl());


        // -------- CLICK HANDLER --------

        map.on('click', function (e) {

            if (!polygonMode) return;

            polygonPoints.push(e.latlng);

            // Skapa polygon när vi har minst 2 punkter
            if (!activePolygon) {
                activePolygon = L.polygon(polygonPoints, {
                    color: "#ff0000",
                    weight: 2,
                    fillColor: "#ff0000",
                    fillOpacity: 0.2
                }).addTo(map);
            } else {
                activePolygon.setLatLngs(polygonPoints);
            }
        });


        // -------- LIVE PREVIEW --------

        map.on('mousemove', function (e) {

            if (!polygonMode || polygonPoints.length === 0) return;

            const previewPoints = [...polygonPoints, e.latlng];

            if (!previewLine) {
                previewLine = L.polyline(previewPoints, {
                    color: "#ff0000",
                    dashArray: "5,5"
                }).addTo(map);
            } else {
                previewLine.setLatLngs(previewPoints);
            }
        });


        // -------- DOUBLE CLICK TO FINISH --------

        map.on('dblclick', function () {

            if (!polygonMode) return;

            polygonMode = false;

            if (previewLine) {
                map.removeLayer(previewLine);
                previewLine = null;
            }

            if (activePolygon) {
                activePolygon.setStyle({
                    color: "green",
                    fillColor: "green"
                });
            }

            console.log("Polygon finalized");
        });

        //-------New button for sending area coordinates to backend--------


        const sendCoordinates = L.Control.extend({
            options: { position: 'topleft' },

            onAdd: function (map) {

                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');

                container.style.backgroundColor = '#28a745';
                container.style.width = '34px';
                container.style.height = '34px';
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';
                container.style.cursor = 'pointer';
                container.style.color = 'white';
                container.title = "Send area to backend";
                container.innerHTML = "GO";

                L.DomEvent.disableClickPropagation(container);

                container.onclick = async function () {

                    if (!activePolygon) {
                        alert("No polygon created.");
                        return;
                    }

                    const latlngs = activePolygon.getLatLngs()[0];

                    const coordinates = latlngs.map(p => ({
                        lat: p.lat,
                        lon: p.lng
                    }));

                    try {
                        const response = await fetch("/api/v1/set_watch_area", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/text"
                            },
                            body: JSON.stringify({
                                msg_type: "set_watch_area",
                                area: {
                                    points: coordinates
                                }
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }

                        const result = await response.json();
                        console.log(result)

                        if (!result.error) {
                            alert("Coordinates sent ok");
                        }
                        else {
                            alert("Error: " + result.error);
                        }

                    } catch (error) {
                        console.error("Error sending watch area", error);
                        alert("Failed to send watch area to backend");
                    }
                };
                return container;
            }
        });


        map.addControl(new sendCoordinates());

        //slut      Slut


        // WebSocket Connections
        const atosWS = new WebSocket(`${BACKEND_URL}/api/v1/ws/atos`);
        const flightmanagerWS = new WebSocket(`${BACKEND_URL}/api/v1/ws/flightmanager`);

        // Handle Layout Changes
        document.getElementById('layoutSelect').addEventListener('change', function () {
            const layout = this.value;
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            const merged = document.getElementById('merged');

            if (layout === 'single') {
                merged.style.display = 'block';
                video1.style.display = 'none';
                video2.style.display = 'none';
            } else if (layout === 'sidebyside') {
                merged.style.display = 'none';
                video1.style.display = 'block';
                video2.style.display = 'block';
            } else if (layout === 'drone1') {
                merged.style.display = 'none';
                video1.style.display = 'block';
                video2.style.display = 'none';
            } else if (layout === 'drone2') {
                merged.style.display = 'none';
                video1.style.display = 'none';
                video2.style.display = 'block';
            }
        });

        flightmanagerWS.onmessage = (event) => {
            console.log(JSON.parse(event.data));
        }

        // Handle Drone Data
        flightmanagerWS.onmessage = (event) => {
            const data = JSON.parse(event.data);

            console.log(data);

            if (data.msg_type == "error") {
                alert(data.error)
            }

            // TODO: Handle all the message types here

            if (data.msg_type == "telemetry") {

                // TODO: This doesn't currently work 

                // Update status
                document.getElementById(`alt${data.drone_id}`).textContent = data.telemetry.alt.toFixed(1);
                document.getElementById(`speed${data.drone_id}`).textContent = data.telemetry.speed.toFixed(1);
                document.getElementById(`battery${data.drone_id}`).textContent = data.telemetry.battery_percent.toFixed(1);

                // Update map marker
                markers[data.drone_id].setLatLng([data.telemetry.lat, data.telemetry.lon]);
            }
        };

        // Control Handlers
        document.getElementById('startBtn').addEventListener('click', () => {
            atosWS.send(JSON.stringify({ command: 'start' }));
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            atosWS.send(JSON.stringify({ command: 'stop' }));
        });

        // Handle ATOS Status
        atosWS.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const statusElement = document.getElementById('atosStatus');
            statusElement.textContent = data.test_active ? "TEST ACTIVE" : "TEST INACTIVE";
            statusElement.className = `badge ${data.test_active ? 'bg-success' : 'bg-secondary'} float-end`;
        };

        function sendFlightCommand(droneId, command) {
            if (flightmanagerWS.readyState === WebSocket.OPEN) {
                const message = {
                    drone_id: parseInt(droneId, 10),
                    command: command
                };
                const jsonMessage = JSON.stringify(message);
                flightmanagerWS.send(jsonMessage);
                console.log(`Sent command to flightmanagerWS: ${jsonMessage}`);
            } else {
                console.error("FlightManager WebSocket is not open. Cannot send command:", command, "for drone", droneId);
                alert("FlightManager connection is not active. Cannot send command."); // User feedback
            }
        }

        document.querySelectorAll('.drone-controls button').forEach(button => {
            button.addEventListener('click', function () {
                const droneId = this.getAttribute('data-drone-id');
                const command = this.getAttribute('data-command');
                if (droneId && command) {
                    sendFlightCommand(droneId, command);
                } else {
                    console.error("Button is missing data-drone-id or data-command attribute:", this);
                }
            });
        });
        document.querySelectorAll('.all-drone-command-btn').forEach(button => {
            button.addEventListener('click', function () {
                const command = this.getAttribute('data-command');
                if (command) {
                    console.log(`Sending command '${command}' to all drones.`);
                    sendFlightCommand(1, command);
                    sendFlightCommand(2, command);
                    // Add more drone IDs here if needed in the future
                    // sendFlightCommand(3, command);
                } else {
                    console.error("All-drone command button is missing data-command attribute:", this);
                }
            });
        });

    </script>
</body>

</html>
