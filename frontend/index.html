<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ATOS Drone Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 480px;
            border-radius: 10px;
        }

        .video-container {
            display: grid;
            gap: 5px;
            height: 480px;
            background: #2c3e50;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-3">
        <h1 class="text-center mb-4">ATOS Drone Platform</h1>

        <div class="row">
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">Live Feed</div>
                    <div class="card-body p-0">
                        <div id="videoContainer" class="video-container">
                            <img id="video1" class="video-stream" src="">
                            <img id="video2" class="video-stream" src="" style="display: none;">
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-primary text-white">Controls & Drone Status</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <h5>Video Layout</h5>
                                    <select id="layoutSelect" class="form-select">
                                        <option value="sidebyside">Side by Side (Auto)</option>
                                    </select>
                                </div>

                                <div id="drone-status-container"></div>

                                <div class="mt-3 all-drone-controls text-center">
                                    <hr>
                                    <h5>All Drone Commands</h5>
                                    <div class="mb-2">
                                        <button id="armAllBtn" data-command="flight_arm"
                                            class="btn btn-success btn-sm all-drone-command-btn">Take Off All</button>
                                        <button id="rthAllBtn" data-command="flight_return_to_home"
                                            class="btn btn-info btn-sm all-drone-command-btn">Return Home All</button>
                                    </div>

                                    <div class="mt-3 p-2 border rounded bg-light">
                                        <h6>Manual Test Detection</h6>
                                        <button id="sendDetection" class="btn btn-secondary btn-sm">Send
                                            Detection</button>
                                        <button id="clearDetection"
                                            class="btn btn-outline-secondary btn-sm">Clear</button>
                                        <div class="mt-2 d-flex flex-wrap justify-content-center gap-1">
                                            <input type="text" id="detection_id"
                                                class="form-control form-control-sm w-auto" placeholder="Tracker ID" />
                                            <input type="text" id="detection_drone_id"
                                                class="form-control form-control-sm w-auto" placeholder="Drone ID" />
                                            <br>
                                            <input type="text" id="detection_lat_lon" width="200"
                                                class="form-control form-control-sm" placeholder="lat, lon" />
                                            <select id="detection_class" class="form-select form-select-sm w-auto">
                                                <option value="person">Person</option>
                                                <option value="vehicle">Vehicle</option>
                                                <option value="car">Car</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-primary text-white">Active Missions</div>
                            <div class="card-body">
                                <div id="active-missions-list">
                                    <p class="text-muted text-center">No missions currently active.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">Create Surveillance Area</div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header bg-primary text-white">Mission Planning</div>
                    <div class="card-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button id="discardAllMissionsBtn" class="btn btn-danger btn-sm d-none">Discard All</button>
                        </div>
                        <div id="mission-list-container" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="missionModal" tabindex="-1" aria-labelledby="missionModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="missionModalLabel">Mission details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-content-area">
                    <div class="select-mission-container"></div>
                    <div id="mission-dynamic-content">Info regarding the mission...</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="discardMissionModalBtn" class="btn btn-danger"
                        data-bs-dismiss="modal">Discard</button>
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Start Mission</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <script>
        const BACKEND_URL_WS = "ws://localhost:8000";
        const BACKEND_URL_HTTP = "http://localhost:8000";

        // ── State ──────────────────────────────────────────────────────────────
        const activeMissions = {};      // { "drone_id": "mission_id" }
        const markers = {};             // { "drone_id": leaflet marker }
        const lastDronePositions = {};  // { "drone_id": [lat, lon] }
        const specsLoaded = {};         // { "drone_id": true }
        let connectedDroneIds = [];     // list of connected drone ids

        // ── Fetch active missions every 5s ─────────────────────────────────────
        async function fetchActiveMissions() {
            try {
                const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/missions`);
                const missions = await response.json();
                missions.forEach(mission => {
                    if (mission.status === "DISPATCHED" || mission.status === "PENDING") {
                        activeMissions[mission.drone_id] = mission.mission_id;
                    }
                });
            } catch (error) {
                console.error("Failed to fetch missions:", error);
            }
        }
        fetchActiveMissions();
        setInterval(fetchActiveMissions, 5000);

        // ── Map state ──────────────────────────────────────────────────────────
        let activePolygon = null;
        let coveragePolygon = null;
        let userMarker = null;
        let watchAreaMarker = null;

        async function dispatchMission(missionId) {
            try {
                const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/missions/dispatch/${missionId}`, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                });
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const result = await response.json();
                if (!result.error) alert("Mission dispatched ok");
                else alert("Error: " + result.error);
            } catch (error) {
                console.error("Error to dispatch", error);
            }
        }

        // ── Create drone status card dynamically ───────────────────────────────
        function createDroneStatusCard(droneId) {
            const container = document.getElementById('drone-status-container');
            // const droneSlot = getDroneSlot(droneId);

            if (!droneId || document.getElementById(`card-${droneId}`)) return;

            const cardHtml = `
                <div class="status-card mb-3" id="card-${droneId}">
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Drone ${droneId} Status</h5>
                            <div>Altitude: <span id="alt${droneId}">--</span> m</div>
                            <div>Speed: <span id="speed${droneId}">--</span> m/s</div>
                            <div>Battery: <span id="battery${droneId}">--</span>%</div>
                        </div>
                        <div class="col-md-6">
                            <h5>Drone ${droneId} Specs</h5>
                            <div>Model: <span id="dronemodel${droneId}">--</span></div>
                            <div>Camera: <span id="camera${droneId}">--</span></div>
                            <div>Camera resolution: <span id="res${droneId}">--</span></div>
                            <div>Speaker: <span id="speaker${droneId}">--</span></div>
                            <div>Spotlight: <span id="spotlight${droneId}">--</span></div>
                        </div>
                        <div class="drone-controls mt-2">
                            <button class="btn btn-danger btn-sm me-1" onclick="abortMission('${droneId}')">Abort Mission</button>
                            <button class="btn btn-info btn-sm" onclick="returnHome('${droneId}')">Return Home</button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('afterbegin', cardHtml);
        }

        function removeDroneStatusCard(droneId) {
            //droneSlot = getDroneSlot(droneId)
            const card = document.getElementById(`card-${droneId}`);
            if (card) card.remove();
        }

        // ── Update video dropdown ──────────────────────────────────────────────
        function updateVideoDropdown(droneId) {
            const select = document.getElementById('layoutSelect');
            if (select.querySelector(`option[value="${droneId}"]`)) return;

            if (!connectedDroneIds.includes(droneId)) {
                connectedDroneIds.push(droneId);

                const optNormal = document.createElement('option');
                optNormal.value = droneId;
                optNormal.textContent = `Drone: ${droneId} (Normal)`;
                select.appendChild(optNormal);

                const optAnnotated = document.createElement('option');
                optAnnotated.value = `${droneId}_annotated`;
                optAnnotated.textContent = `Drone: ${droneId} (Annotated)`;
                select.appendChild(optAnnotated);
            }
        }

        function removeVideoDropdownOptions(droneId) {
            const select = document.getElementById('layoutSelect');
            select.querySelectorAll(`option[value="${droneId}"], option[value="${droneId}_annotated"]`)
                .forEach(o => o.remove());
            connectedDroneIds = connectedDroneIds.filter(id => id !== droneId);
        }

        // ── Handle drone update (connected_drones, drone_connected, telemetry) ─
        function handleDroneUpdate(data) {
            const droneId = data.drone_id;
            if (!droneId) return;

            if (!document.getElementById(`card-${droneId}`)) {
                createDroneStatusCard(droneId);
                updateVideoDropdown(droneId);
            }

            // Specs
            if (data.capabilities && !specsLoaded[droneId]) {
                const caps = data.capabilities;
                const hasCamera = caps.camera;
                document.getElementById(`camera${droneId}`).textContent = hasCamera ? "Yes" : "No";
                if (hasCamera) {
                    document.getElementById(`res${droneId}`).textContent =
                        `${caps.camera.resolution_width}x${caps.camera.resolution_height}`;
                } else {
                    document.getElementById(`res${droneId}`).textContent = "N/A";
                }
                document.getElementById(`speaker${droneId}`).textContent =
                    (caps.speaker && caps.speaker.audio_files?.length > 0) ? "Yes" : "No";
                document.getElementById(`spotlight${droneId}`).textContent = caps.spotlight ? "Yes" : "No";
                document.getElementById(`dronemodel${droneId}`).textContent = data.model;
                specsLoaded[droneId] = true;
            }

            // Telemetry
            if (data.telemetry) {
                const t = data.telemetry;
                lastDronePositions[droneId] = [t.lat, t.lon];

                const altElem = document.getElementById(`alt${droneId}`);
                if (altElem) {
                    altElem.textContent = t.alt.toFixed(1);
                    document.getElementById(`speed${droneId}`).textContent = t.speed.toFixed(1);
                    document.getElementById(`battery${droneId}`).textContent = t.battery_percent;
                }

                if (markers[droneId]) {
                    markers[droneId].setLatLng([t.lat, t.lon]);
                } else {
                    markers[droneId] = L.marker([t.lat, t.lon], {
                        icon: createDroneMarkerIcon(droneId),
                        title: getDroneDisplayName(droneId)
                    }).addTo(map).bindTooltip(getDroneDisplayName(droneId), {
                        permanent: true,
                        direction: 'top',
                        offset: [0, -18]
                    });
                }
            }
        }

        // Mission display
        const missionModal = document.getElementById('missionModal');
        const selectMissionContainer = document.querySelector('#missionModal .select-mission-container');
        let currentTaskData = null;
        let currentMissionModalId = ""
        let currentMissionSetId = ""
        let modalMap = null;
        let currentMissionDroneId = "";

        let allWaypoints = [];
        let activeMissionMapId = "";
        let activeMaps = [];
        const maxDroneSlots = 2;
        const droneDisplayNames = new Map();
        const droneSlotById = new Map();
        const droneIdBySlot = new Map();

        // ── Abort mission ──────────────────────────────────────────────────────
        async function abortMission(droneId) {
            const missionId = activeMissions[droneId];
            if (!missionId) { alert("Ingen aktiv mission för " + droneId); return; }
            if (!confirm(`Avbryt mission för ${droneId}?`)) return;

            try {
                const response = await fetch(
                    `${BACKEND_URL_HTTP}/api/v1/missions/abort/${missionId}`,
                    { method: "POST" }
                );
                const data = await response.json();
                if (data.error) { alert("Fel: " + data.error); return; }
                alert("Mission avbruten!");
                delete activeMissions[droneId];
            } catch (error) {
                console.error("Abort misslyckades:", error);
            }
        }

        // ── Return home ────────────────────────────────────────────────────────
        async function returnHome(droneId) {
            if (!confirm(`Skicka hem ${droneId}?`)) return;
            try {
                const response = await fetch(
                    `${BACKEND_URL_HTTP}/api/v1/missions/return_home/${droneId}`,
                    { method: "POST" }
                );
                const data = await response.json();
                if (data.error) { alert("Fel: " + data.error); return; }
                alert("Drönaren åker hem!");
                delete activeMissions[droneId];
            } catch (error) {
                console.error("Return home misslyckades:", error);
            }
        }
        function createRandomMissionSetId() {
            return window.crypto.randomUUID();
        }

        let proposedMissionSets = new Map();

        // ── Return home all ────────────────────────────────────────────────────
        async function returnHomeAll() {
            if (!confirm("Skicka hem ALLA drönare?")) return;
            for (const droneId of connectedDroneIds) {
                await fetch(`${BACKEND_URL_HTTP}/api/v1/missions/return_home/${droneId}`, { method: "POST" });
                delete activeMissions[droneId];
            }
            alert("Alla drönare åker hem!");
        }

        // ── Mission buttons ────────────────────────────────────────────────────
        const container = document.getElementById('mission-list-container');
        const discardAllMissionsBtn = document.getElementById('discardAllMissionsBtn');
        document.querySelector("#missionModal .btn-success").addEventListener("click", () => {
            dispatchMission(currentMissionModalId);
        });

        async function discardMissionSet(missionSetId) {
            if (!missionSetId) return;

            const missionSet = proposedMissionSets.get(missionSetId);
            if (!missionSet) return;

            const missionIds = Array.isArray(missionSet.missions)
                ? missionSet.missions.map(mission => mission.mission_id).filter(Boolean)
                : [];

            if (missionIds.length === 0) {
                const removed = proposedMissionSets.delete(missionSetId);
                if (!removed) return;

                if (currentMissionSetId === missionSetId) {
                    currentMissionSetId = "";
                    currentMissionModalId = "";
                }

                createMissionButtons();
                return;
            }

            try {
                const response = await fetch("/api/v1/missions/discard", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/text"
                    },
                    body: JSON.stringify({
                        msg_type: "discard_missions",
                        mission_ids: missionIds
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                if (result.error) {
                    alert("Error: " + result.error);
                    return;
                }
            } catch (error) {
                console.error("Error discarding missions", error);
                alert("Failed to discard missions");
                return;
            }

            const removed = proposedMissionSets.delete(missionSetId);
            if (!removed) return;

            if (currentMissionSetId === missionSetId) {
                currentMissionSetId = "";
                currentMissionModalId = "";
            }

            createMissionButtons();
        }

        document.getElementById('discardMissionModalBtn').addEventListener('click', async () => {
            await discardMissionSet(currentMissionSetId);
        });

        discardAllMissionsBtn.addEventListener('click', async () => {
            if (proposedMissionSets.size === 0) return;
            if (!confirm('Discard all detections?')) return;

            const missionSetIds = Array.from(proposedMissionSets.keys());
            for (const missionSetId of missionSetIds) {
                await discardMissionSet(missionSetId);
            }
        });

        container.addEventListener('click', async (event) => {
            const button = event.target.closest('.discard-mission-set-btn');
            if (!button) return;

            const missionSetId = button.getAttribute('data-mission-set-id');
            await discardMissionSet(missionSetId);
        });

        function getDetectionCoordinates(missionSet) {
            if (Array.isArray(missionSet?.gps_position) && missionSet.gps_position.length >= 2) {
                return { lat: missionSet.gps_position[0], lon: missionSet.gps_position[1] };
            }
            if (missionSet?.object_position && missionSet.object_position.lat != null && missionSet.object_position.lon != null) {
                return { lat: missionSet.object_position.lat, lon: missionSet.object_position.lon };
            }
            if (missionSet?.lat != null && missionSet?.lon != null) {
                return { lat: missionSet.lat, lon: missionSet.lon };
            }
            return { lat: 'N/A', lon: 'N/A' };
        }

        function formatCoordinate(value) {
            const numericValue = Number(value);
            if (Number.isNaN(numericValue)) return value;
            return numericValue.toFixed(6);
        }

        function createMissionButtons() {
            container.innerHTML = "";
            discardAllMissionsBtn.classList.toggle('d-none', proposedMissionSets.size === 0);
            proposedMissionSets.values().forEach((missionSet) => {
                const missions = Array.isArray(missionSet.missions) ? missionSet.missions : [];
                const defaultMission = missions[0];
                if (!defaultMission) return;

                const objectType = missionSet.object_type ?? missionSet.detection_type ?? 'Unknown object';
                const detectedId = missionSet.detection_id ?? missionSet.detection_id ?? 'N/A';
                const coords = getDetectionCoordinates(missionSet);
                const detectedTimestamp = missionSet.detected_time ? new Date(missionSet.detected_time).toLocaleTimeString() : 'N/A';

                container.innerHTML += `
                <div class="col-12 mb-2">
                    <div class="mission-card d-flex justify-content-between align-items-center">
                        <div>
                            <strong>Detected ${objectType}, ID: ${detectedId}</strong>
                            <div>Timestamp: ${detectedTimestamp}</div>
                            <div>Lat: ${formatCoordinate(coords.lat)}, Lon: ${formatCoordinate(coords.lon)}</div>
                        </div>
                        <div class="mission-action-row mt-2">
                            <button class="btn btn-success btn-sm mission-action-btn" data-mission-id="${defaultMission.mission_id}" data-mission-set-id="${missionSet.mission_set_id}" data-bs-toggle="modal" data-bs-target="#missionModal">Create Mission</button>
                            <button class="btn btn-danger btn-sm discard-mission-set-btn" data-mission-set-id="${missionSet.mission_set_id}">Discard</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        createMissionButtons();

        function findMissionSetByMissionId(missionId) {
            for (const missionSet of proposedMissionSets.values()) {
                const missions = Array.isArray(missionSet.missions) ? missionSet.missions : [];
                if (missions.some(mission => mission.mission_id === missionId)) {
                    return missionSet;
                }
            }
            return null;
        }

        function renderMissionTypeButtons(missionSet, selectedMissionType) {
            if (!missionSet || !Array.isArray(missionSet.missions)) {
                selectMissionContainer.innerHTML = '';
                return;
            }

            const uniqueMissionTypes = [...new Set(
                missionSet.missions
                    .map(mission => mission.mission_type)
                    .filter(Boolean)
            )];

            selectMissionContainer.innerHTML = '';

            const heading = document.createElement('h6');
            heading.className = 'mb-2';
            heading.textContent = 'Available missions:';
            selectMissionContainer.appendChild(heading);

            uniqueMissionTypes.forEach((missionType) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `btn btn-sm ${missionType === selectedMissionType ? 'btn-primary' : 'btn-info'}`;
                button.style.margin = '.2em';
                button.textContent = missionType;

                button.addEventListener('click', () => {
                    const selected = missionSet.missions.find(mission => mission.mission_type === missionType);
                    if (selected) {
                        renderMissionDetails(selected, missionSet);
                    }
                });

                selectMissionContainer.appendChild(button);
            });

            selectMissionContainer.appendChild(document.createElement('hr'));
        }

        function renderMissionDetails(selectedMission, missionSet) {
            if (!selectedMission) return;

            currentMissionModalId = selectedMission.mission_id;
            currentMissionSetId = missionSet?.mission_set_id ?? '';
            currentMissionDroneId = selectedMission.drone_id ?? '';

            const modalTitle = missionModal.querySelector('.modal-title');
            const modalBody = missionModal.querySelector('#mission-dynamic-content'); // Flyttad hit in
            const droneId = selectedMission.drone_id;
            const detectionType = missionSet?.detection_type ?? missionSet?.object_type ?? 'object';
            const detectedId = missionSet?.detection_id ?? missionSet?.detection_id ?? 'N/A';

            renderMissionTypeButtons(missionSet, selectedMission.mission_type);

            modalTitle.textContent = `Mission for detected ${detectionType} with ID:${detectedId}`;

            let fullContent = '';
            activeMissionMapId = `map-overview-${selectedMission.mission_id}`;
            allWaypoints = [];

            selectedMission.tasks.forEach((task, idx) => {
                let paramsHtml = '';
                const action = task.action;
                const p = task.params;

                if (action === 'go_to') {
                    const waypointNumber = allWaypoints.length + 1;
                    allWaypoints.push({
                        coords: [p.lat, p.lon],
                        label: `Waypoint ${waypointNumber}`
                    });
                    paramsHtml = `<strong>Coordinates:</strong> ${formatCoordinate(p.lat)}, ${formatCoordinate(p.lon)}<br><strong>Altitude:</strong> ${p.alt}m`;
                }
                else if (action === 'play_audio') {
                    paramsHtml = `<p><strong>Plays audiofile:</strong> ${p.file} (${p.duration_seconds}s)</p>`;
                } else if (action === 'led') {
                    paramsHtml = `<p><strong>Type:</strong> ${p.type}</p>`;
                } else if (action === 'spotlight') {
                    paramsHtml = `<p><strong>Pattern:</strong> ${p.pattern} (${p.duration_seconds}s)</p>`;
                } else if (action === 'angle_camera') {
                    paramsHtml = `<p><strong>Pitch:</strong> ${p.pitch} <br><strong>Yaw:</strong> ${p.yaw}</p>`;
                } else if (p != null) {
                    paramsHtml = '<ul>' + Object.entries(p).map(([k, v]) => `<li><strong>${k}:</strong> ${v}</li>`).join('') + '</ul>';
                }

                fullContent += `
            <div class="task-card mb-4 border-bottom pb-3">
                <div class="d-flex justify-content-between">
                    <strong class="fs-5">Task ${idx + 1}</strong>
                    <span class="badge bg-secondary">${action}</span>
                </div>
                <div class="mt-2">${paramsHtml}</div>
            </div>`;
            });

            let mapHtml = allWaypoints.length > 0 ? `
        <div class="mb-4">
            <h6>Mission Route Overview</h6>
            <div id="${activeMissionMapId}" style="height: 250px; width: 100%; border-radius: 8px; background: #eee; border: 1px solid #ccc;"></div>
        </div><hr>` : '';

            const missionDescriptionHtml = `
        <div id="mission-description" class="mb-4">
            <h6>Mission Description</h6>
            <p class="mb-1">${selectedMission.description}</p>
            <span class="badge bg-dark">Drone: ${getDroneDisplayName(droneId)}</span>
        </div>
        <hr>
    `;

            modalBody.innerHTML = mapHtml + missionDescriptionHtml + fullContent;

            if (missionModal.classList.contains('show')) {
                setTimeout(() => {
                    renderMissionOverviewMap();
                }, 50);
            }
        }

        missionModal.addEventListener('shown.bs.modal', function () {
            renderMissionOverviewMap();
        });

        function renderMissionOverviewMap() {
            activeMaps.forEach(m => m.remove());
            activeMaps = [];

            const mapContainer = document.getElementById(activeMissionMapId);
            if (!mapContainer || allWaypoints.length === 0) return;

            const modalMap = L.map(activeMissionMapId).setView(allWaypoints[0].coords, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMap);

            const markerGroup = L.featureGroup();
            allWaypoints.forEach(point => {
                const marker = L.circleMarker(point.coords, {
                    radius: 8,
                    fillColor: "#198754",
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.95
                }).addTo(markerGroup);

                marker.bindTooltip(point.label, {
                    permanent: true,
                    direction: 'right',
                    offset: [10, 0]
                }).openTooltip();
            });

            // Show drone's last know position
            const resolvedMissionDrone = resolveMissionDroneMarker(currentMissionDroneId);
            if (resolvedMissionDrone) {
                const currentPos = resolvedMissionDrone.marker.getLatLng();

                L.marker(currentPos, {
                    icon: createDroneMarkerIcon(resolvedMissionDrone.resolvedDroneId),
                    title: getDroneDisplayName(resolvedMissionDrone.resolvedDroneId)
                }).addTo(markerGroup);
            }

            if (allWaypoints.length > 1) {
                L.polyline(allWaypoints.map(p => p.coords), {
                    color: 'blue',
                    weight: 3,
                    opacity: 0.6,
                    dashArray: '5, 10'
                }).addTo(modalMap);
            }

            markerGroup.addTo(modalMap);
            modalMap.fitBounds(markerGroup.getBounds(), { padding: [30, 30] });

            setTimeout(() => modalMap.invalidateSize(), 200);
            activeMaps.push(modalMap);
        }

        createMissionButtons();

        missionModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const missionSetId = button.getAttribute('data-mission-set-id');
            const missionId = button.getAttribute('data-mission-id');
            const missionSet = proposedMissionSets.get(missionSetId) ?? findMissionSetByMissionId(missionId);
            if (!missionSet) return;

            const selectedMission = missionSet.missions.find(mission => mission.mission_id === missionId);
            renderMissionDetails(selectedMission, missionSet);
        });

        // Creates map for action = go_to
        missionModal.addEventListener('shown.bs.modal', function () {
            renderMissionOverviewMap();
        });

        function getDroneDisplayName(droneId) {
            const idString = String(droneId ?? '');
            return droneDisplayNames.get(idString) ?? (idString ? `Drone ${idString}` : 'Drone ?');
        }

        function updateDroneSlotLabels(slot) {
            const displayName = droneIdBySlot.get(slot)
                ? getDroneDisplayName(droneIdBySlot.get(slot))
                : `Drone ${slot}`;

            const statusLabel = document.getElementById(`statusLabel${slot}`);
            const specLabel = document.getElementById(`specLabel${slot}`);

            if (statusLabel) statusLabel.textContent = displayName;
            if (specLabel) specLabel.textContent = displayName;
        }

        function registerDroneDisplayName(droneId) {
            const normalizedDroneId = String(droneId ?? '');
            if (!normalizedDroneId) return null;

            if (droneSlotById.has(normalizedDroneId)) {
                return droneSlotById.get(normalizedDroneId);
            }

            for (let slot = 1; slot <= maxDroneSlots; slot += 1) {
                if (!droneIdBySlot.has(slot)) {
                    const displayName = `Drone ${slot}`;
                    droneDisplayNames.set(normalizedDroneId, displayName);
                    droneSlotById.set(normalizedDroneId, slot);
                    droneIdBySlot.set(slot, normalizedDroneId);
                    updateDroneSlotLabels(slot);
                    return slot;
                }
            }

            const overflowIndex = droneDisplayNames.size + 1;
            const displayName = `Drone ${overflowIndex}`;
            droneDisplayNames.set(normalizedDroneId, displayName);
            return null;
        }

        function resolveMissionDroneMarker(droneId) {
            if (!markers) return null;

            if (droneId && markers[droneId]) {
                return { marker: markers[droneId], resolvedDroneId: droneId };
            }

            const targetLabel = getDroneDisplayName(droneId);
            const markerEntries = Object.entries(markers);

            const labelMatch = markerEntries.find(([markerDroneId]) => {
                return getDroneDisplayName(markerDroneId) === targetLabel;
            });

            if (labelMatch) {
                return { marker: labelMatch[1], resolvedDroneId: labelMatch[0] };
            }

            if (markerEntries.length > 0) {
                return { marker: markerEntries[0][1], resolvedDroneId: markerEntries[0][0] };
            }

            return null;
        }

        function createDroneMarkerIcon(droneId) {
            return L.icon({
                iconUrl: 'images/drone-marker.png',
                iconSize: [42, 42],
                iconAnchor: [21, 42],
                tooltipAnchor: [0, -18]
            });
        }

        function refreshMissionOverviewMapIfVisible() {
            if (!missionModal.classList.contains('show')) return;
            if (!activeMissionMapId || allWaypoints.length === 0) return;

            setTimeout(() => {
                renderMissionOverviewMap();
            }, 0);
        }

        const DEFAULT_MAP_CENTER = [57.705841, 11.938096];

        // Initialize Surviellance area map
        const map = L.map('map').setView(DEFAULT_MAP_CENTER, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function ensureDroneMarker(droneId, lat, lon) {
            registerDroneDisplayName(droneId);

            if (!markers[droneId]) {
                markers[droneId] = L.marker([lat, lon], {
                    icon: createDroneMarkerIcon(droneId),
                    title: getDroneDisplayName(droneId)
                }).addTo(map);

                markers[droneId].bindTooltip(getDroneDisplayName(droneId), {
                    direction: 'top',
                    offset: [0, -18]
                });
            }

            markers[droneId].setLatLng([lat, lon]);
            refreshMissionOverviewMapIfVisible();
            return markers[droneId];
        }

        /**
          * Function to fetch and display user location
          * @param {boolean} centerMap - Whether to pan the map to the user
          */
        function locateUser(centerMap = false) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        if (centerMap) map.setView([lat, lng], 15);
                        if (!userMarker) {
                            userMarker = L.circleMarker([lat, lng], {
                                radius: 10, fillColor: "#007bff", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
                            }).addTo(map).bindPopup("You are here");
                        } else {
                            userMarker.setLatLng([lat, lng]);
                        }
                    },
                    (error) => { if (centerMap) map.setView([57.705841, 11.938096], 15); }
                );
            }
        }
        locateUser(true);

        async function loadWatchArea() {
            try {
                const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/get_watch_area`);
                const data = await response.json();
                if (data.points && data.points.length > 0) {
                    const latlngs = data.points.map(p => [p.lat, p.lon]);
                    activePolygon = L.polygon(latlngs, { color: "green", fillOpacity: 0.3 }).addTo(map);
                    map.fitBounds(activePolygon.getBounds());
                }
                if (data.coverage && data.coverage.length > 0) {
                    if (coveragePolygon) map.removeLayer(coveragePolygon);
                    const coverageLatlngs = data.coverage[0].map(p => [p[0], p[1]]);
                    coveragePolygon = L.polygon(coverageLatlngs, {
                        color: "#0000AA", weight: 2, dashArray: "5, 5", fillColor: "#0000AA", fillOpacity: 0.1
                    }).addTo(map);
                }
            } catch (error) {
                console.error("Failed to load watch area:", error);
            }
        }

                btn.style.cssText = 'background:white;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
                btn.title = "Go to my location";
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 16.5017C14.4853 16.5017 16.5 14.487 16.5 12.0017C16.5 9.5164 14.4853 7.50168 12 7.50168C9.51472 7.50168 7.5 9.5164 7.5 12.0017C7.5 14.487 9.51472 16.5017 12 16.5017ZM12 14.5034C10.6184 14.5034 9.49832 13.3833 9.49832 12.0017C9.49832 10.62 10.6184 9.5 12 9.5C13.3816 9.5 14.5017 10.62 14.5017 12.0017C14.5017 13.3833 13.3816 14.5034 12 14.5034Z" fill="#0F0F0F"/><path fill-rule="evenodd" clip-rule="evenodd" d="M11 1C11 0.447715 11.4477 0 12 0C12.5523 0 13 0.447715 13 1V2.04938C17.7244 2.51844 21.4816 6.27558 21.9506 11H23C23.5523 11 24 11.4477 24 12C24 12.5523 23.5523 13 23 13H21.9506C21.4816 17.7244 17.7244 21.4816 13 21.9506V23C13 23.5523 12.5523 24 12 24C11.4477 24 11 23.5523 11 23V21.9506C6.27558 21.4816 2.51844 17.7244 2.04938 13H1C0.447715 13 0 12.5523 0 12C-1.19209e-07 11.4477 0.447715 11 1 11H2.04938C2.51844 6.27558 6.27558 2.51844 11 2.04938V1ZM12 20.0016C7.58083 20.0016 3.99839 16.4192 3.99839 12C3.99839 7.58083 7.58083 3.99839 12 3.99839C16.4192 3.99839 20.0016 7.58083 20.0016 12C20.0016 16.4192 16.4192 20.0016 12 20.0016Z" fill="#0F0F0F"/></svg>';
                L.DomEvent.disableClickPropagation(btn);
                btn.onclick = () => locateUser(true);
                return btn;
            }
        });
        map.addControl(new LocateControl());

        const DrawControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const btn = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                btn.style.cssText = 'background:white;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
                btn.title = "Click to mark an area";
                btn.innerHTML = '<img src="/images/penna_with_sträck.jpg" width=28>';
                L.DomEvent.disableClickPropagation(btn);
                btn.onclick = function () {
                    if (activePolygon) { map.removeLayer(activePolygon); activePolygon = null; }
                    if (previewLine) { map.removeLayer(previewLine); previewLine = null; }
                    polygonMode = true;
                    polygonPoints = [];
                };
                return btn;
            }
        });
        map.addControl(new DrawControl());

        map.on('click', function (e) {
            if (!polygonMode) return;
            polygonPoints.push(e.latlng);
            if (!activePolygon) {
                activePolygon = L.polygon(polygonPoints, { color: "#ff0000", weight: 2, fillColor: "#ff0000", fillOpacity: 0.2 }).addTo(map);
            } else {
                activePolygon.setLatLngs(polygonPoints);
            }
        });

        map.on('mousemove', function (e) {
            if (!polygonMode || polygonPoints.length === 0) return;
            const previewPoints = [...polygonPoints, e.latlng];
            if (!previewLine) {
                previewLine = L.polyline(previewPoints, { color: "#ff0000", dashArray: "5,5" }).addTo(map);
            } else {
                previewLine.setLatLngs(previewPoints);
            }
        });

        map.doubleClickZoom.disable();
        map.on('dblclick', function (e) {
            if (!polygonMode) return;
            polygonMode = false;
            if (previewLine) { map.removeLayer(previewLine); previewLine = null; }
            if (activePolygon) activePolygon.setStyle({ color: "green", fillColor: "green" });
        });

        const SendCoordinatesControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const btn = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                btn.style.cssText = 'background:#28a745;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;';
                btn.title = "Send area to backend";
                btn.innerHTML = "GO";
                L.DomEvent.disableClickPropagation(btn);
                btn.onclick = async function () {
                    if (!activePolygon) { alert("No polygon created."); return; }
                    const latlngs = activePolygon.getLatLngs()[0];
                    const coordinates = latlngs.map(p => ({ lat: p.lat, lon: p.lng }));
                    try {
                        const response = await fetch(`${BACKEND_URL_HTTP}/api/v1/set_watch_area`, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain" },
                            body: JSON.stringify({ msg_type: "set_watch_area", area: { points: coordinates } })
                        });
                        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                        const result = await response.json();
                        if (result.error) { alert("Error: " + result.error); return; }
                        if (result.data && result.data.mission.length === 0) {
                            alert(result.data.message || "No drone available for GotoSurveil mission");
                            return;
                        }
                        alert(`Dispatched ${result.data.mission.drone_id} on surveil mission`);
                        const coords = [result.data.mission.coordinates.lat, result.data.mission.coordinates.lon];
                        const altitude = result.data.mission.coordinates.alt;
                        if (coords) {
                            const watchAreaIcon = L.icon({ iconUrl: '/images/camera.png', iconSize: [20, 15], iconAnchor: [10, 15], popupAnchor: [0, -28] });
                            if (watchAreaMarker) watchAreaMarker.setLatLng(coords);
                            else watchAreaMarker = L.marker(coords, { icon: watchAreaIcon, title: 'Watch Area Coordinates' }).addTo(map).bindPopup(`Target altitude: ${altitude}m`);
                        }
                        if (result.data.coverage_corners && result.data.coverage_corners.length > 0) {
                            const corners = result.data.coverage_corners[0];
                            const latlngs = corners.map(corner => [corner[0], corner[1]]);
                            if (coveragePolygon) map.removeLayer(coveragePolygon);
                            coveragePolygon = L.polygon(latlngs, { color: '#0000AA', weight: 2, dashArray: '5, 5', fillColor: '#0000AA', fillOpacity: 0.1 }).addTo(map);
                            coveragePolygon.bindPopup(`Drone ${result.data.mission.drone_id} estimated coverage area. Target altitude: ${altitude}m`);
                        }
                    } catch (error) {
                        console.error("Error sending watch area", error);
                        alert("Failed to send watch area to backend " + error);
                    }
                };
                return btn;
            }
        });
        map.addControl(new SendCoordinatesControl());

        // ── WebSocket ──────────────────────────────────────────────────────────
        const atosWS = new WebSocket(`${BACKEND_URL_WS}/api/v1/ws/atos`);
        const flightmanagerWS = new WebSocket(`${BACKEND_URL_WS}/api/v1/ws/flightmanager`);

        // ── Video layout ───────────────────────────────────────────────────────
        document.getElementById('layoutSelect').addEventListener('change', function () {
            const layout = this.value;
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            const videoContainer = document.getElementById('videoContainer');

            video1.style.display = 'none';
            video2.style.display = 'none';
            videoContainer.style.gridTemplateColumns = '1fr';

            if (layout === 'sidebyside') {
                if (connectedDroneIds.length >= 2) {
                    video1.src = `/api/v1/video_feed/drone${connectedDroneIds[0]}`;
                    video2.src = `/api/v1/video_feed/drone${connectedDroneIds[1]}`;
                    video1.style.display = 'block';
                    video2.style.display = 'block';
                    videoContainer.style.gridTemplateColumns = '1fr 1fr';
                } else {
                    alert("Need at least 2 drones for Side by Side");
                    if (connectedDroneIds.length >= 1) {
                        video1.src = `/api/v1/video_feed/drone${connectedDroneIds[0]}`;
                        video1.style.display = 'block';
                    }
                }
            } else {
                video1.src = `/api/v1/video_feed/drone${layout}`;
                video1.style.display = 'block';
            }
        });

        // Handle Drone Data
        function getDroneSlot(droneId) {
            const normalizedDroneId = String(droneId ?? '');
            if (!normalizedDroneId) return null;
            return droneSlotById.get(normalizedDroneId) ?? registerDroneDisplayName(normalizedDroneId);
        }



        flightmanagerWS.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.msg_type !== "telemetry") {
                console.log(data);
            }

            if (data.msg_type === "error") {
                alert(data.error);
                return;
            }

            if (data.msg_type === "connected_drones") {
                const drones = Array.isArray(data.drones) ? data.drones : [];
                drones.forEach(drone => {
                    handleDroneUpdate(drone);
                });
                // Set initial video to first connected drone
                if (drones.length > 0 && !document.getElementById('video1').src.includes('video_feed')) {
                    document.getElementById('video1').src = `/api/v1/video_feed/drone${drones[0].drone_id}`;
                    document.getElementById('video1').style.display = 'block';
                }
            }

            if (data.msg_type === "drone_connected") {
                handleDroneUpdate(data);
                // Auto-set video if first drone
                if (connectedDroneIds.length === 1) {
                    document.getElementById('video1').src = `/api/v1/video_feed/drone${data.drone_id}`;
                    document.getElementById('video1').style.display = 'block';
                }
            }

            if (data.msg_type === "drone_disconnected") {
                const droneId = data.drone_id;
                removeDroneStatusCard(droneId);
                removeVideoDropdownOptions(droneId);
                delete activeMissions[droneId];
                delete specsLoaded[droneId];
                delete lastDronePositions[droneId];
                if (markers[droneId]) {
                    map.removeLayer(markers[droneId]);
                    delete markers[droneId];
                }
            }

            if (data.msg_type === "telemetry") {
                handleDroneUpdate(data);
            }

            if (data.msg_type === "proposed_missions") {
                const missionsID = createRandomMissionSetId();
                const detectionTimestamp = Date.now();
                const rawDetectedTimestamp = data.timestamp ?? data.detected_timestamp;

                const detectedTime = (() => {
                    if (rawDetectedTimestamp == null || rawDetectedTimestamp === '') {
                        return new Date(detectionTimestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }
                    const numericTs = Number(rawDetectedTimestamp);
                    if (!Number.isNaN(numericTs)) {
                        return new Date(numericTs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }
                    return String(rawDetectedTimestamp);
                })();

                proposedMissionSets.set(missionsID, {
                    mission_set_id: missionsID,
                    detection_id: data.detection_id,
                    object_type: data.object_type,
                    gps_position: data.gps_position,
                    detected_time: detectedTime,
                    timestamp: detectionTimestamp,
                    received_timestamp: detectionTimestamp,
                    missions: Array.isArray(data.missions) ? data.missions : []
                });

                createMissionButtons();
            }
        };

        // Lyssnare för kommandon till alla drönare (från main)
        document.querySelectorAll('.all-drone-command-btn').forEach(button => {
            button.addEventListener('click', function () {
                const command = this.getAttribute('data-command');
                if (command) {

        document.querySelector("#sendDetection").onclick = async (event) => {
            try {
                const fyrfästet = [57.693093, 11.984072];
                const response = await fetch("/api/v1/set_detections", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify([{
                        drone_ids: [document.getElementById("detection_drone_id").value],
                        gps_position: [parseFloat(document.getElementById("detection_lat_lon").value.split(",")[0]), parseFloat(document.getElementById("detection_lat_lon").value.split(",")[1])],
                        object_type: document.getElementById("detection_class").value,
                        detection_id: document.getElementById("detection_id").value,
                        timestamp: new Date().getMilliseconds()
                    }])
                });
                const result = await response.json();
                if (result.error) alert("Error: " + result.error);
                else console.log("detections sent ok");
            } catch (error) {
                alert("Failed to send detections to backend");
            }
        };

        document.querySelector("#clearDetection").onclick = async () => {
            try {
                const response = await fetch("/api/v1/set_detections", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify([])
                });
                const result = await response.json();
                if (result.error) alert("Error: " + result.error);
                else console.log("detections cleared");
            } catch (error) {
                alert("Failed to clear detections");
            }
        };
